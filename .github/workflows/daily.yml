name: Daily Papers

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST(22:00 UTC), 전날(KST) 논문 처리
  workflow_dispatch:
    inputs:
      date:
        description: "처리할 날짜 (YYYY-MM-DD, 비우면 어제)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch & summarize
        timeout-minutes: 60
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          MAX_PAPERS: ${{ vars.MAX_PAPERS }}
        run: python scripts/fetch.py ${{ inputs.date }}

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ${{ inputs.date || 'daily update' }}"
          git push

      - name: Build site
        if: ${{ !cancelled() }}
        run: python scripts/build.py site

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site

      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
